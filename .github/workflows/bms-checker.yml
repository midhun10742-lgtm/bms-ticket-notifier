
name: BMS Ticket Checker

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Diagnose BookMyShow connectivity
        run: |
          echo "=== Runner public IP ==="
          curl -s https://api.ipify.org
          echo
      
          echo "=== BookMyShow homepage ==="
          curl -sS -o /tmp/bms-home.html \
            -w "HTTP status: %{http_code}\n" \
            https://in.bookmyshow.com/
      
          echo "=== BookMyShow API endpoint ==="
          curl -sS -o /tmp/bms-api.html \
            -w "HTTP status: %{http_code}\n" \
            https://in.bookmyshow.com/api/movies-data/v4/showtimes-by-event/primary-dynamic
      
          echo "=== Response preview ==="
          head -c 500 /tmp/bms-api.html
          echo
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run checker
        env:
          # Movie 1
          BMS1_URL: ${{ vars.BMS1_URL }}
          BMS1_DATES: ${{ vars.BMS1_DATES }}
          BMS1_THEATRES: ${{ vars.BMS1_THEATRES }}
          BMS1_TIME: ${{ vars.BMS1_TIME }}

          # Movie 2
          BMS2_URL: ${{ vars.BMS2_URL }}
          BMS2_DATES: ${{ vars.BMS2_DATES }}
          BMS2_THEATRES: ${{ vars.BMS2_THEATRES }}
          BMS2_TIME: ${{ vars.BMS2_TIME }}

          # Test mode
          BMS_TEST_MODE: ${{ vars.BMS_TEST_MODE }}

          # Resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ vars.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}

          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: uv run main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bms_state.json
          git diff --cached --quiet || (git commit -m "chore: update bms_state.json [skip ci]" && git push)
